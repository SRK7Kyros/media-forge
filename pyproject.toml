[project]
name = "media-forge"
version = "0.1.0"
description = "Maintain a Jellyfin-shaped hardlink clone tree beside a media library."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "SRK7Kyros" }]
keywords = ["jellyfin", "hardlink", "media", "library", "windows"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: Microsoft :: Windows",
    "Environment :: Console",
]
dependencies = ["watchdog>=4"]

[project.scripts]
mediaforge = "mediaforge.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["mediaforge"]

[tool.hatch.build.targets.sdist]
include = ["mediaforge/**", "plugins/**", "example.env", "service/**", "tests/**", "LICENSE", "README.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = ["build", "dist", ".venv"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
