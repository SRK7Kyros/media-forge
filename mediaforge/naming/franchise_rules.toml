# Franchise rules. Each rule is tried in file order; the first match wins.
#
# `match` is applied to the folder name with its trailing "(YYYY)" removed.
# `order` says how the watch-order number is decoded from the match:
#   dotted -> group "order" is "4.1"  => (4, 1)   [int parts, never floats]
#   roman  -> group "roman" is "IV"   => (4,)
#   int    -> group "num"  is "2"     => (2,)
#   table  -> the whole folder name is looked up in `table`
# `strip` = true replaces the folder name with the match's `title` group when
# building the Jellyfin folder name; false keeps the folder name as it is.

[[rule]]
key = "MCU"
sort_key = "MCU"
set_name = "Marvel Cinematic Universe"
match = '^MCU\s+(?P<order>\d+\.\d+)\s+-\s+(?P<title>.+)$'
order = "dotted"
strip = true

[[rule]]
key = "STAR WARS"
sort_key = "STAR WARS"
set_name = "Star Wars"
match = '^Star Wars\s+-\s+Episodio\s+(?P<roman>[IVX]+)\b'
order = "roman"
strip = false

[[rule]]
key = "SPIDER-VERSE"
sort_key = "SPIDER-VERSE"
set_name = "Spider-Verse"
order = "table"
strip = false
table = { "Spider-Man - Un nuovo universo" = 1, "Spider-Man - Across the Spider-Verse" = 2 }

[[rule]]
key = "ROCKY"
sort_key = "ROCKY"
set_name = "Rocky"
order = "table"
strip = false
table = { "Rocky" = 1, "Rocky II" = 2, "Rocky III" = 3, "Rocky IV" = 4, "Rocky V" = 5, "Rocky Balboa" = 6 }

[[rule]]
